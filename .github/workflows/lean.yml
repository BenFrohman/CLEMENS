name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.22.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
            lake-packages
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}
          restore-keys: |
            lake-

      - name: Update and build
        run: |
          lake update
          lake build

      - name: Print axioms
        run: |
          lean --run -e 'import Clemens.IncidenceRigidityEquivalence
          #print axioms ClemensConjecture.clemens_full_boundary_theorem' || true
          echo "---"
          lean Clemens/IncidenceRigidityEquivalence.lean --print-axioms 2>&1 | head -50 || true
